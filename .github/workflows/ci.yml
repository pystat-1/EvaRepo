name: CI

# Type-check and unit tests on every push and pull request (the deploy
# workflow runs the same checks before deploying main).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
