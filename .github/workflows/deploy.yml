name: Build and deploy to Cloudflare Workers

# Builds the OpenNext/Cloudflare output on GitHub's runner, then deploys it
# with wrangler — same two steps `npm run cf:deploy` runs locally, just
# authenticated via CLOUDFLARE_API_TOKEN instead of an interactive
# `wrangler login`. Replaces the old Netlify workflow (see
# PROJECT_GOALS.md's Goal 4 status box): the deploy target moved to this
# Cloudflare Worker (`evarepo`) on 2026-09-15/16, but the CI pipeline was
# never updated to match until now.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never deploy code that fails its checks.
      - name: Type-check and unit tests
        run: npx next typegen && npx tsc --noEmit -p . && npx vitest run

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
