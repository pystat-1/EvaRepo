name: Eva Desktop (Windows installer and updates)

# Builds the Windows installer on GitHub's Windows machines (Rust, MSVC and
# WebView2 are preinstalled there).
#   - Run by hand from the Actions tab: the installer is attached to the run.
#   - Push a tag like "desktop-v0.2.0": a GitHub Release is published with
#     the installer, its update signature and latest.json. Installed copies
#     of Eva find it within 6 hours and offer the update (with a backup
#     first). The tag's version must match apps/desktop/src-tauri/tauri.conf.json.
# Update signing needs two repository secrets (Settings -> Secrets ->
# Actions): TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Without them the installer is still built, only without update files.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "tag $want but app version $have"; exit 1; }
      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build
          else echo "::warning::no update signing key: building without update files"; npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*
      - name: Update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: node apps/desktop/scripts/update-manifest.mjs "${GITHUB_REF_NAME}" > latest.json
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Eva ${{ github.ref_name }}
          draft: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
