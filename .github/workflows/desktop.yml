name: Eva Desktop (Windows installer)

# Builds the Windows installer on GitHub's Windows machines (Rust, MSVC and
# WebView2 are preinstalled there). Run it by hand from the Actions tab, or
# push a tag like "desktop-v0.1.0". The installer is attached to the run
# as an artifact (and to a draft release for tags).
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Database and rules tests
        run: npx vitest run packages
      - name: Build installer
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
